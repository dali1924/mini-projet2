<form>
  <div [hidden]="ajout">
    <label>ID Spécialité</label>
    <input
      type="text"
      [(ngModel)]="specialite.idSpec"
      name="idSpecialite"
      class="form-control w-25"
    />
  </div>
  <div>
    <label>Nom Spécialité</label>
    <input
      type="text"
      [(ngModel)]="specialite.nomSpec"
      name="nomSpecialite"
      class="form-control"
      placeholder="Entrez un nom de spécialité..."
    />
  </div>
  <div class="mt-2">
    <button
      type="submit"
      [disabled]="!specialite.nomSpec"
      class="btn btn-success"
      (click)="saveSpecialite()"
    >
      {{ ajout ? 'Ajouter' : 'Modifier' }}
    </button>
  </div>
</form>
