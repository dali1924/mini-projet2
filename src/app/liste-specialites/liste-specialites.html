<div class="container">
  <div class="col-sm-4 col-md-4 col-lg-4 mb-4 mt-3">
    <app-update-specialite
      [specialite]="updatedSpec"
      (specialiteUpdated)="specialiteUpdated($event)"
      [ajout]="ajout"
    >
    </app-update-specialite>
  </div>

  <div class="card shadow mb-4">
    <div class="card-body">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Id</th>
            <th>Nom Spécialité</th>
            <th>Action</th>
          </tr>
        </thead>
        @for (spec of specialites; track spec.idSpec) {
          <tbody>
            <tr>
              <td>{{ spec.idSpec }}</td>
              <td>{{ spec.nomSpec }}</td>
              <td><a class="btn btn-success" (click)="updateSpec(spec)">Editer</a></td>
            </tr>
          </tbody>
        }
      </table>
    </div>
  </div>
</div>
